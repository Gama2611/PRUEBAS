# Compila el agente Android de ADIPACK MDM en GitHub Actions.
#  - Siempre: APK debug (sólo para pruebas) + informe de lint.
#  - Si existen los Secrets de la llave de firma: APK release firmado (el que se sube al MDM).
#  - Al crear un tag "agente-v*" (ej. agente-v1.0.5): publica el APK release en "Releases".
name: Agente Android

on:
  push:
    branches: [main, master]
    paths: ["agent-android/**", ".github/workflows/agente-android.yml"]
    tags: ["agente-v*"]
  pull_request:
    paths: ["agent-android/**"]
  workflow_dispatch: {}

permissions:
  contents: write # necesario sólo para publicar el APK en Releases

concurrency:
  group: agente-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agent-android
    env:
      # Cada ejecución sube el versionCode: Android sólo acepta actualizaciones con código mayor.
      MDM_VERSION_CODE: ${{ github.run_number }}
      MDM_VERSION_NAME: 1.0.${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.MDM_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar Gradle Wrapper (seguridad)
        uses: gradle/actions/wrapper-validation@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Restaurar llave de firma desde Secrets
        if: env.HAS_KEYSTORE == 'true'
        env:
          MDM_KEYSTORE_BASE64: ${{ secrets.MDM_KEYSTORE_BASE64 }}
        run: |
          echo "$MDM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/adipack-mdm.jks"
          echo "MDM_KEYSTORE=$RUNNER_TEMP/adipack-mdm.jks" >> "$GITHUB_ENV"

      - name: Compilar APK debug y lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug lintDebug

      - name: Compilar APK release firmado
        if: env.HAS_KEYSTORE == 'true'
        env:
          MDM_KEYSTORE_PASS: ${{ secrets.MDM_KEYSTORE_PASS }}
          MDM_KEY_ALIAS: ${{ secrets.MDM_KEY_ALIAS }}
          MDM_KEY_PASS: ${{ secrets.MDM_KEY_PASS }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verificar firma y preparar archivos
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/adipack-mdm-agente-${MDM_VERSION_NAME}-debug.apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/adipack-mdm-agente-${MDM_VERSION_NAME}.apk"
          fi
          for f in dist/*.apk; do
            echo "::group::$f"
            "$BT/apksigner" verify --print-certs "$f"
            "$BT/aapt2" dump badging "$f" | grep -E "^package:"
            echo "::endgroup::"
          done
          ( cd dist && sha256sum *.apk | tee SHA256SUMS.txt )
          {
            echo "### Agente ADIPACK MDM ${MDM_VERSION_NAME} (versionCode ${MDM_VERSION_CODE})"
            if [ "$HAS_KEYSTORE" = "true" ]; then
              echo "APK release firmado listo: súbelo al MDM (Apps > Es el agente MDM)."
            else
              echo "> ⚠️ Sin Secrets de firma: sólo se generó el APK **debug** (para pruebas)."
              echo "> No lo uses en las tablets de producción: su firma cambia en cada compilación."
            fi
            echo '```'; cat dist/SHA256SUMS.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar APKs
        uses: actions/upload-artifact@v4
        with:
          name: agente-android-${{ env.MDM_VERSION_NAME }}
          path: agent-android/dist/
          retention-days: 90

      - name: Guardar informe de lint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-${{ env.MDM_VERSION_NAME }}
          path: agent-android/app/build/reports/lint-results-*.html
          if-no-files-found: ignore

      - name: Publicar en Releases (tags agente-v*)
        if: startsWith(github.ref, 'refs/tags/agente-v') && env.HAS_KEYSTORE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            agent-android/dist/adipack-mdm-agente-${{ env.MDM_VERSION_NAME }}.apk
            agent-android/dist/SHA256SUMS.txt
